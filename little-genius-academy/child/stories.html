<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stories and Rhymes — Little Genius Academy</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Cormorant+Garamond:ital,wght@1,600&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/learning.css">
  <link rel="stylesheet" href="../css/stories.css">
  <link rel="stylesheet" href="../css/fun.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="child-theme" data-root="../" data-page="stories">
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>
  <main id="main">
    <section class="section"><div class="container">
      <div class="learn-bar">
        <a class="btn btn--ghost btn--small" href="world.html">← Back</a>
        <h1>Stories and Rhymes</h1>
        <span class="child-badge" id="child-badge"></span>
        <button type="button" class="sound-btn" id="sound-btn"></button>
      </div>
      <p class="msg" id="page-msg" role="alert" hidden></p>
      <div class="grid grid--3" id="story-list" aria-live="polite"><p class="muted">Loading…</p></div>

      <div id="story-view" hidden>
        <button type="button" class="btn btn--ghost btn--small" id="story-back">← All stories</button>

        <div class="storybook" id="storybook">
          <!-- The cover: tap to open the book -->
          <div class="cover" id="cover">
            <div class="cover__emoji" id="cover-emoji" aria-hidden="true"></div>
            <h2 class="cover__title" id="story-title"></h2>
            <p class="cover__kind" id="cover-kind"></p>
            <button type="button" class="btn btn--sun cover__open" id="cover-open">📖 Open the book</button>
          </div>
          <!-- The open book: picture page on the left, words on the right -->
          <div class="spread" id="spread">
            <div class="scene" id="scene" aria-hidden="true"></div>
            <div class="paper" id="paper">
              <p class="book__text" id="book-text" aria-live="polite"></p>
              <p class="paper__num" id="book-count"></p>
            </div>
          </div>
        </div>

        <div class="book__nav" id="book-nav" hidden>
          <button type="button" class="btn btn--ghost" id="book-prev">← Back</button>
          <button type="button" class="btn btn--sun" id="book-read">🔊 Read to me</button>
          <button type="button" class="btn" id="book-next">Next →</button>
        </div>
        <div class="dots" id="dots" aria-hidden="true"></div>
        <div class="book__tools" id="book-tools" hidden>
          <button type="button" class="pill" id="voice-btn"></button>
          <button type="button" class="pill" id="speed-btn"></button>
        </div>

        <div class="reward" id="reward" hidden>
          <div class="reward__stars" aria-hidden="true">📖⭐📖</div>
          <h2>The end!</h2>
          <p>You finished it. Well done!</p>
          <div class="reward__actions">
            <button type="button" class="btn btn--sun" id="reward-again">Read again</button>
            <button type="button" class="btn" id="reward-back">More stories</button>
          </div>
        </div>
      </div>
    </div></section>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/fun.js"></script>
  <script src="../js/sound.js"></script>
  <script src="../js/navigation.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/story-art.js"></script>
  <script src="../js/stories.js"></script>
</body>
</html>
