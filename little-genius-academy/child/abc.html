<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ABC Alphabet World — Little Genius Academy</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Cormorant+Garamond:ital,wght@1,600&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/learning.css">
  <link rel="stylesheet" href="../css/fun.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="child-theme" data-root="../" data-page="learn" data-subject="ABC Alphabet World">
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>
  <main id="main">
    <section class="section"><div class="container">
      <div class="learn-bar">
        <a class="btn btn--ghost btn--small" href="world.html">← Back</a>
        <h1 id="subject-title"></h1>
        <span class="child-badge" id="child-badge"></span>
        <button type="button" class="sound-btn" id="sound-btn"></button>
      </div>
      <p class="msg" id="page-msg" role="alert" hidden></p>
      <div class="grid grid--3" id="lesson-list" aria-live="polite"><p class="muted">Loading…</p></div>

      <div id="lesson-view" hidden>
        <button type="button" class="btn btn--ghost btn--small" id="lesson-back">← All lessons</button>
        <h2 id="lesson-title" style="margin-top:16px"></h2>
        <p class="muted" id="lesson-instructions"></p>
        <div class="stage" id="stage" aria-live="polite"></div>
        <div class="tiles" id="tiles"></div>
        <div class="lesson-progress">
          <strong id="lesson-progress"></strong>
          <div class="lesson-progress__track"><div class="lesson-progress__bar" id="lesson-bar"></div></div>
        </div>
        <div class="reward" id="reward" hidden>
          <div class="reward__stars" aria-hidden="true">🌟⭐🌟</div>
          <h2>Great job!</h2>
          <p>You finished the lesson!</p>
          <div class="reward__actions">
            <button type="button" class="btn btn--sun" id="reward-again">Play again</button>
            <button type="button" class="btn" id="reward-back">More lessons</button>
          </div>
        </div>
      </div>
    </div></section>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/fun.js"></script>
  <script src="../js/lesson-data.js"></script>
  <script src="../js/navigation.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/learning.js"></script>
</body>
</html>
