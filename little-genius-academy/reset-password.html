<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a new password — Little Genius Academy</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Cormorant+Garamond:ital,wght@1,600&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-root="" data-page="reset">
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>
  <main id="main">
    <section class="section"><div class="container">
      <div class="card card--purple form-card">
        <h1 style="font-size:2rem">Choose a new password</h1>
        <p class="muted" style="margin-bottom:20px">Enter your new password below.</p>
        <p class="msg" id="form-msg" role="alert" hidden></p>
        <form id="reset-form" novalidate>
          <div class="field"><label for="password">New password</label><input type="password" id="password" name="password" autocomplete="new-password" required minlength="8"></div>
          <div class="field"><label for="confirm">Confirm new password</label><input type="password" id="confirm" name="confirm" autocomplete="new-password" required minlength="8"></div>
          <button class="btn" id="submit-btn" type="submit">Save password</button>
        </form>
        <div class="form-links"><a href="login.html">Back to log in</a></div>
      </div>
    </div></section>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
